[project]
name = "slidgemax"
version = "0.4.0"
description = "Slidge-based XMPP gateway for the MAX messenger."
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
authors = [{ name = "Black Roland" }]
keywords = ["xmpp", "max", "slidge", "gateway", "transport", "pymax"]
dependencies = [
    "slidge>=0.5.0",
    "maxapi-python>=2.4.1",
]

[project.scripts]
slidgemax = "slidgemax.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/slidgemax"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]
